name: CI — homework1

# Chạy khi:
#   - Push lên branch homework1 (main) hoặc bất kỳ branch homework1_* (feature)
#   - Tạo hoặc cập nhật PR nhắm vào branch homework1
#
# Khi thêm homework2: tạo file .github/workflows/homework2-ci.yml
# với cùng cấu trúc, thay 'homework1' → 'homework2' và thư mục tương ứng
on:
  push:
    branches:
      - 'homework1'       # main branch
      - 'homework1_**'    # tất cả feature branches: homework1_001-*, homework1_002-*, ...
  pull_request:
    branches:
      - 'homework1'       # chỉ PR nhắm vào main mới cần CI gate

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Kiểm tra Backend (Node.js / Express)
  # ─────────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # mọi lệnh `run` chạy trong thư mục backend/

    steps:
      # Bước 1: Clone toàn bộ repo về máy ảo runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đúng version Node.js, bật cache npm để lần sau nhanh hơn
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Bước 3: Install dependencies từ package-lock.json (không thay đổi lock file)
      - name: Install dependencies
        run: npm ci

      # Bước 4: Bỏ comment khi đã có ESLint setup
      # - name: Lint
      #   run: npm run lint

      # Bước 5: Bỏ comment khi đã viết tests
      # - name: Test
      #   run: npm test

  # ─────────────────────────────────────────────
  # Job 2: Kiểm tra Frontend (React / Vite)
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend  # mọi lệnh `run` chạy trong thư mục frontend/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build production bundle — nếu bước này fail là có lỗi syntax/import
      # Cần env vars vì Vite embed chúng vào bundle lúc build
      - name: Build
        run: npm run build
        env:
          # Lấy từ: GitHub repo → Settings → Secrets and variables → Actions
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
