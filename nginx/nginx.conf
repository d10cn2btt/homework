log_format upstream_log '$remote_addr → $upstream_addr [$status] $request';

upstream instance_pool {
    server backend:3000;
}

# Public — chặn /internal để client ngoài không gọi được
server {
    listen 80;

    access_log /dev/stdout upstream_log;

    location /internal {
        return 403;
    }

    location / {
        proxy_pass http://instance_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Internal — chỉ dùng trong Docker network, gateway gọi vào đây
server {
    listen 8081;

    access_log /dev/stdout upstream_log;

    location / {
        proxy_pass http://instance_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
