services:
  instance-1:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/homework_dev
      REDIS_URL: redis://redis:6379
      GATEWAY_URL: http://gateway:8080
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  instance-2:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/homework_dev
      REDIS_URL: redis://redis:6379
      GATEWAY_URL: http://gateway:8080
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  instance-3:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/homework_dev
      REDIS_URL: redis://redis:6379
      GATEWAY_URL: http://gateway:8080
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - instance-1
      - instance-2
      - instance-3

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    env_file: ./backend/.env # load env from backend since gateway needs same env vars
    environment:
      PORT: 8080
      NGINX_URL: http://nginx:80
      GATEWAY_SELF_URL: http://gateway:8080
    depends_on:
      - nginx

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file: ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - nginx

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: homework_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
